<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Luyện phân tích nhân tử</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Patrick+Hand&family=STIX+Two+Text:wght@400;500;600&display=swap">
<style>
/* Layout: vở ô li — one column of exercises on grid paper; student answers in purple ink, grades in the teacher's red pen. */
:root{
  --paper:#f6f8fc; --surface:#ffffff; --grid:rgba(70,110,190,.07); --grid-strong:rgba(70,110,190,.13);
  --ink:#1d2433; --muted:#5d6577; --line:#d9dfea;
  --violet:#5b3fa8; --violet-soft:#ece7fa;
  --red:#cf2e2a; --red-soft:#fbe9e7;
  --green:#257a4a; --green-soft:#e3f3e9;
  --chip:#eef1f7;
  --f-body:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-math:"STIX Two Text", "Cambria Math", Cambria, "Times New Roman", serif;
  --f-hand:"Patrick Hand", "Comic Sans MS", "Chalkboard SE", cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#13161e; --surface:#1b1f2a; --grid:rgba(140,160,220,.05); --grid-strong:rgba(140,160,220,.09);
  --ink:#e7e9f0; --muted:#9aa2b4; --line:#2e3443;
  --violet:#b8a4ff; --violet-soft:#2a2442;
  --red:#ff6f62; --red-soft:#3a1f1e;
  --green:#5fcf8e; --green-soft:#183326;
  --chip:#232836; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#13161e; --surface:#1b1f2a; --grid:rgba(140,160,220,.05); --grid-strong:rgba(140,160,220,.09);
  --ink:#e7e9f0; --muted:#9aa2b4; --line:#2e3443;
  --violet:#b8a4ff; --violet-soft:#2a2442;
  --red:#ff6f62; --red-soft:#3a1f1e;
  --green:#5fcf8e; --green-soft:#183326;
  --chip:#232836; color-scheme:dark }

*{box-sizing:border-box}
body{
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid-strong) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-strong) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:48px 48px,48px 48px,12px 12px,12px 12px;
  color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.55;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:10px 0}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.total{font-family:var(--f-hand);color:var(--red);font-size:26px;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums;
  border:2px solid var(--red);border-radius:50%;padding:8px 12px 6px;transform:rotate(-4deg)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500;display:flex;gap:6px;align-items:center;text-decoration:none;color:var(--ink)}
.tab .p{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.tab.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tab.on .p{color:var(--surface);opacity:.75}
.tab.full .p{color:var(--green)}
.tab.on.full .p{color:var(--surface)}

main.wrap{padding-block:20px 64px}
.sec-head h2{margin:0 0 4px;font-size:22px;line-height:1.25;letter-spacing:-.015em;text-wrap:balance}
.sec-meta{color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}
.rule{margin:14px 0 6px;background:var(--violet-soft);border-radius:10px;padding:12px 14px;font-size:14.5px}
.rule b{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--violet);margin-bottom:2px}
.level{margin-top:28px}
.level-h{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.level-h::after{content:"";flex:1;height:1px;background:var(--line)}
.dots{letter-spacing:2px;color:var(--violet)}

/* item */
.item{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 10px;padding-block:18px;border-bottom:1px dashed var(--line)}
.num{font-family:var(--f-hand);font-size:26px;color:var(--muted);line-height:1;padding-top:2px;font-variant-numeric:tabular-nums}
.num small{display:block;font-family:var(--f-body);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.mark{font-family:var(--f-hand);font-size:22px;line-height:1;display:block;margin-top:4px}
.mark.ok{color:var(--green)} .mark.no{color:var(--red)}
.body{min-width:0}
.ask{color:var(--muted);font-size:13px;margin-bottom:2px}
.badge{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--red);border:1px solid var(--red);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px}
.math{font-family:var(--f-math);font-size:19px;line-height:1.5;overflow-wrap:anywhere}
.expr{margin-bottom:10px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:8px}
.opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;display:flex;gap:10px;align-items:baseline;min-height:46px}
.opt .k{font-size:12px;font-weight:600;color:var(--muted);flex:0 0 auto}
.opt .math{font-size:17.5px}
.opt:not(:disabled):hover{border-color:var(--violet)}
.opt:disabled{cursor:default}
.opt.picked{border-color:var(--violet);background:var(--violet-soft)}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.text{font-size:14.5px}

.fillrow{display:flex;flex-wrap:wrap;align-items:center;gap:3px;font-family:var(--f-math);font-size:20px;line-height:2}
.blank{width:3.2em;height:38px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--violet);
  font-family:var(--f-math);font-size:19px;text-align:center;font-weight:600;padding:0}
.sign{width:38px;height:38px;border:1.5px dashed var(--violet);border-radius:8px;background:var(--surface);color:var(--violet);font-family:var(--f-math);font-size:22px;font-weight:600;line-height:1;padding:0}
.sign.empty{color:var(--muted)}
.blank.right,.sign.right{border-color:var(--green);border-style:solid;color:var(--green)}
.blank.wrong,.sign.wrong{border-color:var(--red);border-style:solid;color:var(--red)}
.roots{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.roots label{display:flex;align-items:center;gap:6px;font-family:var(--f-math);font-size:18px}
.roots .blank{width:5.2em}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.btn{border:0;background:var(--ink);color:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px}
.btn.ghost{background:transparent;color:var(--violet);border:1px solid var(--violet)}
.btn:disabled{opacity:.4;cursor:default}
.tip{font-size:13px;color:var(--muted)}

.steps{display:flex;flex-direction:column;gap:6px}
.step{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:baseline}
.step .k{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.step .math{font-size:17.5px}
.step.txt .math{font-family:var(--f-body);font-size:14.5px}
.step:not(:disabled):hover{border-color:var(--violet)}
.step:disabled{cursor:default}
.step.right{border-color:var(--green);background:var(--green-soft)}
.step.wrong{border-color:var(--red);background:var(--red-soft)}
.step.truth{border-color:var(--red);border-style:dashed}
.fixq{margin:12px 0 8px;font-size:14px;font-weight:600}

.fb{margin-top:12px;border-left:3px solid var(--red);padding:6px 0 6px 12px;font-size:14.5px}
.fb.ok{border-color:var(--green)}
.fb .v{font-family:var(--f-hand);font-size:20px;line-height:1.1;color:var(--red);margin-bottom:2px}
.fb.ok .v{color:var(--green)}
.fb .why{margin-bottom:4px}
.fb .sol{color:var(--muted)}
.fb .sol b{color:var(--ink);font-weight:600}
.fb .err{display:inline-block;margin-top:4px;font-size:12px;color:var(--red);background:var(--red-soft);border-radius:4px;padding:1px 6px}

.pager{display:flex;justify-content:space-between;gap:10px;margin-top:28px;flex-wrap:wrap}
.pager a{color:var(--violet);font-weight:600;text-decoration:none;padding:8px 0}
.reset{margin-top:20px}

/* results */
.res-top{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin:16px 0 8px}
.big{font-family:var(--f-hand);color:var(--red);font-size:54px;line-height:1;border:3px solid var(--red);border-radius:50%;padding:18px 22px 12px;transform:rotate(-5deg);font-variant-numeric:tabular-nums}
.res-top p{margin:0;max-width:44ch}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto;margin-top:8px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td a{color:var(--ink);font-weight:600;text-decoration:none}
.bar{height:8px;border-radius:4px;background:var(--chip);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--green)}
h3{font-size:16px;margin:30px 0 4px}
.errs{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:10px}
.errs li{display:grid;grid-template-columns:42px minmax(0,1fr);gap:10px;align-items:start}
.errs .c{font-family:var(--f-hand);font-size:26px;color:var(--red);line-height:1;text-align:right}
.errs .l{font-weight:600}
.errs .w{font-size:13px;color:var(--muted)}
.errs .w a{color:var(--violet)}
.empty{color:var(--muted);font-size:14px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<script type="application/json" id="bank">{"sections": [{"id": "k", "short": "Khởi động", "title": "Khởi động: bẫy dấu", "rule": "Dấu trừ trước ngoặc → đổi dấu TẤT CẢ hạng tử trong ngoặc. y − x = −(x − y). Bình phương mất dấu trừ, lập phương giữ dấu trừ.", "levels": [{"name": "Bẫy dấu", "items": [{"type": "mc", "p": "Bỏ ngoặc: −(3x − 2y + 5)", "ok": "−3x + 2y − 5", "wrong": [["−3x − 2y + 5", "ngoac", "Chỉ đổi dấu hạng tử đầu tiên. Phải đổi dấu cả −2y và +5."], ["−3x − 2y − 5", "ngoac", "−2y đổi dấu phải thành +2y."], ["3x − 2y + 5", "ngoac", "Bỏ dấu trừ mà không đổi dấu hạng tử nào."]], "sol": "Đổi dấu từng hạng tử: 3x → −3x, −2y → +2y, +5 → −5.", "hint": null}, {"type": "fill", "p": "Điền vào chỗ trống: 7 − 2x = −(2x ☐ ☐)", "tpl": "7 − 2x = −(2x ☐ ☐)", "ans": ["−", "7"], "alts": [], "sol": "7 − 2x = −(2x − 7). Thử lại: −(2x − 7) = −2x + 7. Khớp.", "tag": "doidau", "hint": null}, {"type": "tf", "lhs": "(3 − x)²", "rhs": "(x − 3)²", "truth": true, "sol": "Bình phương thì mất dấu trừ: (3 − x)² = [−(x − 3)]² = (x − 3)².", "tag": "luythua"}, {"type": "tf", "lhs": "(2 − x)³", "rhs": "(x − 2)³", "truth": false, "sol": "Lập phương giữ dấu trừ: (2 − x)³ = −(x − 2)³.", "tag": "luythua"}, {"type": "tf", "lhs": "(x − y)(y − x)", "rhs": "(x − y)²", "truth": false, "sol": "(y − x) = −(x − y), nên (x − y)(y − x) = −(x − y)².", "tag": "doidau"}, {"type": "mc", "p": "5x² − 5x = ?", "ok": "5x(x − 1)", "wrong": [["5x·x", "so1", "Hạng tử 5x trùng nhân tử chung thì còn lại 1, không phải 0."], ["5x(x − 5)", "chung", "5x : 5x = 1, không phải 5."], ["x(5x − 1)", "chung", "Nhân tử chung lớn nhất là 5x, và x(5x − 1) = 5x² − x, không bằng đề."]], "sol": "5x² − 5x = 5x·x − 5x·1 = 5x(x − 1).", "hint": null}, {"type": "mc", "p": "Tính: −3²", "ok": "−9", "wrong": [["9", "luythua", "−3² = −(3²) = −9. Chỉ (−3)² mới bằng 9."]], "sol": "Lũy thừa làm trước, dấu trừ làm sau: −3² = −9.", "hint": null}]}]}, {"id": "d1", "short": "Dạng 1", "title": "Dạng 1: Đặt nhân tử chung", "rule": "ƯCLN của hệ số × biến chung với số mũ nhỏ nhất → đưa ra ngoài, giữ nguyên dấu từng hạng tử. Đặt −a ra ngoài thì đổi dấu MỌI hạng tử trong ngoặc.", "levels": [{"name": "Nhận biết", "items": [{"type": "mc", "p": "6x² + 9x", "ok": "3x(2x + 3)", "wrong": [["3(2x² + 3x)", "trietde", "Còn x chung trong ngoặc, phải đặt cả x ra ngoài."], ["3x(2x + 9)", "chung", "9x : 3x = 3, không phải 9."], ["3x(2x − 3)", "giudau", "+9x đưa vào ngoặc vẫn là +3."]], "sol": "ƯCLN(6, 9) = 3, biến chung x → 6x² + 9x = 3x(2x + 3).", "hint": null}, {"type": "mc", "p": "x³ − 4x² + x", "ok": "x(x² − 4x + 1)", "wrong": [["x(x² − 4x)", "so1", "Hạng tử x chia cho x còn 1, không mất đi."], ["x(x² + 4x + 1)", "giudau", "−4x² đưa vào ngoặc phải là −4x."], ["x(x² − 4)", "chung", "Thiếu hạng tử, mỗi hạng tử của đề phải có một hạng tử tương ứng trong ngoặc."]], "sol": "x³ − 4x² + x = x·x² − x·4x + x·1 = x(x² − 4x + 1).", "hint": null}, {"type": "fill", "p": "12x³y² − 18x²y³", "tpl": "6x²y²(☐x ☐ ☐y)", "ans": ["2", "−", "3"], "alts": [], "sol": "ƯCLN(12, 18) = 6, biến chung x²y² → 6x²y²(2x − 3y).", "tag": "giudau", "hint": null}, {"type": "mc", "p": "−4x² − 8x", "ok": "−4x(x + 2)", "wrong": [["−4x(x − 2)", "ngoac", "Đặt −4x ra ngoài: −8x : (−4x) = +2."], ["4x(x + 2)", "ngoac", "4x(x + 2) = 4x² + 8x, mất dấu trừ."], ["−4(x² + 2x)", "trietde", "Còn x chung trong ngoặc."]], "sol": "Đặt −4x ra ngoài: −4x² : (−4x) = x; −8x : (−4x) = 2 → −4x(x + 2).", "hint": null}]}, {"name": "Thông hiểu", "items": [{"type": "mc", "p": "2x(x − 3) + 5(x − 3)", "ok": "(x − 3)(2x + 5)", "wrong": [["(x − 3)(2x − 5)", "giudau", "+5(x − 3) nên trong ngoặc là +5."], ["10x(x − 3)²", "chung", "Đặt nhân tử chung thì CỘNG phần còn lại, không nhân."], ["(x + 3)(2x + 5)", "giudau", "Nhân tử chung là (x − 3), chép sai dấu."]], "sol": "Nhân tử chung (x − 3): 2x(x − 3) + 5(x − 3) = (x − 3)(2x + 5).", "hint": null}, {"type": "mc", "p": "3x(x − 2y) + 6y(2y − x)", "ok": "3(x − 2y)²", "wrong": [["3(x − 2y)(x + 2y)", "doidau", "(2y − x) = −(x − 2y), không phải (x − 2y). Phải đổi dấu cả 6y."], ["−3(x − 2y)²", "doidau", "Đổi dấu hai lần: +6y(2y − x) = −6y(x − 2y) rồi giữ nguyên."], ["(x − 2y)(3x − 6y)", "trietde", "Ngoặc (3x − 6y) còn đặt được 3 ra ngoài."]], "sol": "6y(2y − x) = −6y(x − 2y) → (x − 2y)(3x − 6y) = 3(x − 2y)(x − 2y) = 3(x − 2y)².", "hint": null}, {"type": "fill", "p": "5x(x − 1) − 3(1 − x)", "tpl": "(x − 1)(5x ☐ 3)", "ans": ["+"], "alts": [], "sol": "−3(1 − x) = +3(x − 1) → (x − 1)(5x + 3).", "tag": "doidau", "hint": null}, {"type": "mc", "p": "(x − 2)(x + 3) − 2(x − 2)", "ok": "(x − 2)(x + 1)", "wrong": [["(x − 2)(x + 5)", "giudau", "Trừ 2: (x + 3) − 2 = x + 1."], ["−2(x − 2)²(x + 3)", "chung", "Đặt nhân tử chung thì trừ phần còn lại, không nhân."], ["(x + 2)(x + 1)", "giudau", "Nhân tử chung là (x − 2)."]], "sol": "(x − 2)[(x + 3) − 2] = (x − 2)(x + 1).", "hint": null}]}, {"name": "Vận dụng", "items": [{"type": "fill", "p": "(x − 1)(2x + 3) − (1 − x)(x + 5)", "tpl": "(x − 1)(☐x ☐ ☐)", "ans": ["3", "+", "8"], "alts": [], "sol": "−(1 − x)(x + 5) = +(x − 1)(x + 5) → (x − 1)(2x + 3 + x + 5) = (x − 1)(3x + 8).", "tag": "doidau", "hint": null}, {"type": "mc", "p": "4x² − 6x − (2x − 3)(x + 4)", "ok": "(2x − 3)(x − 4)", "wrong": [["(2x − 3)(x + 4)", "ngoac", "2x − (x + 4) = 2x − x − 4, phải đổi dấu cả số 4."], ["(2x − 3)(3x + 4)", "ngoac", "Đây là phép trừ, không phải cộng."], ["2x(2x − 3)(x + 4)", "chung", "Đặt nhân tử chung thì trừ phần còn lại, không nhân."]], "sol": "4x² − 6x = 2x(2x − 3) → (2x − 3)[2x − (x + 4)] = (2x − 3)(x − 4).", "hint": null}, {"type": "mc", "p": "(3x − 2)(x + 1) − (2 − 3x)(2x − 5) + (3x − 2)   (Thử thách)", "ok": "3(3x − 2)(x − 1)", "wrong": [["(3x − 2)(7 − x)", "doidau", "−(2 − 3x) = +(3x − 2), không phải −(3x − 2)."], ["(3x − 2)(3x − 4)", "so1", "Hạng tử (3x − 2) cuối cùng còn lại 1, đừng bỏ."], ["(3x − 2)(3x − 3)", "trietde", "(3x − 3) còn đặt được 3 ra ngoài."]], "sol": "= (3x − 2)[(x + 1) + (2x − 5) + 1] = (3x − 2)(3x − 3) = 3(3x − 2)(x − 1).", "hint": null}]}, {"name": "Soi lỗi", "items": [{"type": "spot", "p": "3x(x − 5) − 2(5 − x)", "steps": [["= 3x(x − 5) − 2(x − 5)", "3x(x − 5) − 2(x − 5)"], ["= (x − 5)(3x − 2)", "(x - 5)(3x - 2)"]], "wrong": 0, "fixes": [["= 3x(x − 5) + 2(x − 5)", true], ["= 3x(x − 5) − 2(x + 5)", false], ["= 3x(5 − x) − 2(5 − x)", false]], "sol": "−2(5 − x) = +2(x − 5). Kết quả đúng: (x − 5)(3x + 2).", "tag": "doidau"}, {"type": "spot", "p": "−6x³ + 9x² − 3x", "steps": [["Nhân tử chung: ƯCLN(6, 9, 3) = 3, biến chung x. Đặt −3x ra ngoài.", null], ["= −3x(2x² + 3x + 1)", "−3x(2x² + 3x + 1)"], ["= −3x(x + 1)(2x + 1)", "−3x(x + 1)(2x + 1)"]], "wrong": 1, "fixes": [["= −3x(2x² − 3x + 1)", true], ["= −3x(2x² − 3x − 1)", false], ["= −3x(−2x² + 3x − 1)", false]], "sol": "Đặt −3x ra ngoài thì đổi dấu mọi hạng tử: −3x(2x² − 3x + 1) = −3x(x − 1)(2x − 1).", "tag": "ngoac"}]}]}, {"id": "d2", "short": "Dạng 2", "title": "Dạng 2: Dùng hằng đẳng thức", "rule": "2 hạng tử bình phương, có dấu trừ → A² − B². 3 hạng tử → (A ± B)². 2 hạng tử lập phương → A³ ± B³. A − B mà B là cả biểu thức thì phải để B trong ngoặc.", "levels": [{"name": "Nhận biết", "items": [{"type": "mc", "p": "25x² − 9", "ok": "(5x − 3)(5x + 3)", "wrong": [["(5x − 3)²", "hdt", "(5x − 3)² = 25x² − 30x + 9, thừa hạng tử −30x."], ["(25x − 9)(25x + 9)", "hdt", "25x² = (5x)², 9 = 3²: A = 5x, B = 3."], ["(5x − 9)(5x + 9)", "hdt", "9 = 3², nên B = 3 chứ không phải 9."]], "sol": "25x² − 9 = (5x)² − 3² = (5x − 3)(5x + 3).", "hint": null}, {"type": "mc", "p": "x² − 10x + 25", "ok": "(x − 5)²", "wrong": [["(x + 5)²", "hdt", "Hạng tử giữa −10x mang dấu trừ → (A − B)²."], ["(x − 5)(x + 5)", "hdt", "(x − 5)(x + 5) = x² − 25, không có −10x."], ["(x − 25)²", "hdt", "25 = 5², nên B = 5."]], "sol": "x² − 2·x·5 + 5² = (x − 5)².", "hint": null}, {"type": "fill", "p": "9x² + 6x + 1", "tpl": "(☐x ☐ ☐)²", "ans": ["3", "+", "1"], "alts": [], "sol": "9x² + 2·3x·1 + 1² = (3x + 1)².", "tag": "hdt", "hint": null}, {"type": "mc", "p": "x³ − 8", "ok": "(x − 2)(x² + 2x + 4)", "wrong": [["(x − 2)(x² − 2x + 4)", "hdt", "A³ − B³ = (A − B)(A² + AB + B²): dấu giữa là cộng."], ["(x − 2)(x² + 4x + 4)", "hdt", "Hạng tử giữa là AB = 2x, không phải 2AB."], ["(x − 2)³", "hdt", "(x − 2)³ = x³ − 6x² + 12x − 8, khác đề."]], "sol": "x³ − 2³ = (x − 2)(x² + 2x + 4).", "hint": null}]}, {"name": "Thông hiểu", "items": [{"type": "mc", "p": "−x² + 6x − 9", "ok": "−(x − 3)²", "wrong": [["(x − 3)²", "ngoac", "Quên dấu trừ đặt ra ngoài."], ["−(x + 3)²", "ngoac", "−x² + 6x − 9 = −(x² − 6x + 9): +6x vào ngoặc thành −6x."], ["(3 − x)²", "luythua", "(3 − x)² = (x − 3)², bình phương làm mất dấu trừ."]], "sol": "−x² + 6x − 9 = −(x² − 6x + 9) = −(x − 3)².", "hint": null}, {"type": "fill", "p": "27x³ + 1", "tpl": "(☐x ☐ 1)(9x² ☐ 3x ☐ 1)", "ans": ["3", "+", "−", "+"], "alts": [], "sol": "(3x)³ + 1³ = (3x + 1)(9x² − 3x + 1). Tổng lập phương: dấu giữa ngoặc sau là trừ.", "tag": "hdt", "hint": null}, {"type": "mc", "p": "(2x − 1)² − 9", "ok": "4(x − 2)(x + 1)", "wrong": [["(2x − 4)(2x + 2)", "trietde", "Mỗi ngoặc còn đặt được 2 ra ngoài."], ["(2x − 10)(2x + 8)", "hdt", "9 = 3², nên B = 3 chứ không phải 9."], ["4(x + 2)(x − 1)", "ngoac", "A = 2x − 1, không phải 2x + 1."]], "sol": "(2x − 1 − 3)(2x − 1 + 3) = (2x − 4)(2x + 2) = 4(x − 2)(x + 1).", "hint": null}, {"type": "mc", "p": "(3x + 2)² − (x − 4)²", "ok": "4(x + 3)(2x − 1)", "wrong": [["4(x − 1)(2x − 1)", "ngoac", "(3x + 2) − (x − 4) = 3x + 2 − x + 4: phải đổi dấu −4 thành +4."], ["(2x + 6)(4x + 6)", "ngoac", "Ngoặc cộng: (3x + 2) + (x − 4) = 4x − 2, giữ nguyên dấu."], ["(2x + 6)(4x − 2)", "trietde", "Mỗi ngoặc còn đặt được 2 ra ngoài."]], "sol": "[(3x + 2) − (x − 4)][(3x + 2) + (x − 4)] = (2x + 6)(4x − 2) = 4(x + 3)(2x − 1).", "hint": null}]}, {"name": "Vận dụng", "items": [{"type": "fill", "p": "8x³ − 36x²y + 54xy² − 27y³", "tpl": "(☐x ☐ ☐y)³", "ans": ["2", "−", "3"], "alts": [], "sol": "(2x)³ − 3·(2x)²·3y + 3·2x·(3y)² − (3y)³ = (2x − 3y)³.", "tag": "hdt", "hint": null}, {"type": "mc", "p": "16(x − 1)² − 9(x + 2)²", "ok": "(x − 10)(7x + 2)", "wrong": <script>
(function(){
const DATA = JSON.parse(document.getElementById('bank').textContent);
const SECS = DATA.sections, TAGS = DATA.tags, SIGN = new Set(DATA.signTags);
const KEY = 'pt8-luyen-v1';
let S = {};
try { S = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch(e) { S = {}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LETTERS = 'ABCD';
// assign ids
const ITEMS = [];
SECS.forEach(sec => { let n = 0; sec.levels.forEach(lv => lv.items.forEach(it => { n++; it.id = sec.id + '-' + n; it.n = n; it.sec = sec; ITEMS.push(it); })); sec.count = n; });

function hash(s){ let h = 2166136261; for (const ch of s){ h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function shuffled(arr, seed){ const a = arr.slice(); let h = hash(seed) || 1; for (let i = a.length - 1; i > 0; i--){ h = Math.imul(h ^ (h >>> 15), 2246822507) >>> 0; h = (h ^ (h >>> 13)) >>> 0; const j = h % (i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function secScore(sec){ let done = 0, ok = 0; ITEMS.filter(i => i.sec === sec).forEach(i => { const r = S[i.id]; if (r && r.done){ done++; if (r.ok) ok++; } }); return {done, ok, total: sec.count}; }
function totalScore(){ let done = 0, ok = 0; ITEMS.forEach(i => { const r = S[i.id]; if (r && r.done){ done++; if (r.ok) ok++; } }); return {done, ok, total: ITEMS.length}; }

function record(it, ok, tag, extra){ S[it.id] = Object.assign({done: true, ok, tag: ok ? null : tag}, extra || {}); save(); renderItem(it); renderChrome(); }

// ---------- parsing answers
function normSign(s){ return s.replace(/[−–]/g, '-'); }
function parseNum(s){
  s = normSign(String(s)).trim().replace(/^x\s*=\s*/i, '').replace(/\s+/g, '').replace(',', '.');
  if (!s) return NaN;
  const m = s.match(/^(-?)(\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);
  if (m) return (m[1] ? -1 : 1) * parseFloat(m[2]) / parseFloat(m[3]);
  if (!/^-?\d+(\.\d+)?$/.test(s)) return NaN;
  return parseFloat(s);
}
const near = (a, b) => Math.abs(a - b) < 1e-9;

// ---------- prompt split
function splitPrompt(p){
  let challenge = false;
  if (p.includes('(Thử thách)')){ challenge = true; p = p.replace('(Thử thách)', '').trim(); }
  let label = '', expr = p;
  const i = p.indexOf(':');
  if (i > -1){ label = p.slice(0, i).trim(); expr = p.slice(i + 1).trim(); }
  return {label, expr, challenge};
}
const DEFAULT_ASK = {mc: 'Phân tích thành nhân tử', fill: 'Phân tích thành nhân tử, điền vào ô trống', solve: 'Tìm x', num: 'Tính nhanh', spot: 'Lời giải dưới đây có một bước sai dấu. Bấm vào bước sai đầu tiên', tf: 'Đúng hay sai?'};

function feedback(ok, why, sol, tag){
  const v = ok ? 'Đúng rồi!' : 'Chưa đúng';
  return `<div class="fb ${ok ? 'ok' : ''}" role="status"><div class="v">${v}</div>${why ? `<div class="why">${esc(why)}</div>` : ''}<div class="sol"><b>Lời giải:</b> ${esc(sol)}</div>${!ok && tag && TAGS[tag] ? `<span class="err">Lỗi: ${esc(TAGS[tag])}</span>` : ''}</div>`;
}

// ---------- item renderers
function itemShell(it, inner){
  const r = S[it.id];
  const mark = r && r.done ? `<span class="mark ${r.ok ? 'ok' : 'no'}" aria-label="${r.ok ? 'đúng' : 'sai'}">${r.ok ? '✓' : '✗'}</span>` : '';
  return `<div class="num"><small>Câu</small>${it.n}${mark}</div><div class="body">${inner}</div>`;
}

function renderMC(it){
  const r = S[it.id] || {};
  const {label, expr, challenge} = splitPrompt(it.p || '');
  let opts;
  if (it.type === 'tf') opts = [{t: 'Đúng', ok: it.truth}, {t: 'Sai', ok: !it.truth}];
  else opts = shuffled([{t: it.ok, ok: true}].concat(it.wrong.map(w => ({t: w[0], ok: false, tag: w[1], why: w[2]}))), it.id);
  const ask = it.type === 'tf' ? DEFAULT_ASK.tf : (label || DEFAULT_ASK.mc);
  const shown = it.type === 'tf' ? `${esc(it.lhs)} = ${esc(it.rhs)}` : esc(expr);
  let html = `<div class="ask">${esc(ask)}${challenge ? '<span class="badge">Thử thách</span>' : ''}</div><div class="math expr">${shown}</div><div class="opts">`;
  opts.forEach((o, k) => {
    let cls = 'opt' + (it.type === 'tf' ? ' text' : '');
    if (r.done){ if (o.ok) cls += ' right'; else if (r.pick === o.t) cls += ' wrong'; }
    html += `<button class="${cls}" data-k="${k}" ${r.done ? 'disabled' : ''}><span class="k">${it.type === 'tf' ? '' : LETTERS[k]}</span><span class="${it.type === 'tf' ? '' : 'math'}">${esc(o.t)}</span></button>`;
  });
  html += '</div>';
  if (r.done){
    const picked = opts.find(o => o.t === r.pick) || {};
    html += feedback(r.ok, r.ok ? '' : picked.why, it.sol, r.tag);
  }
  const el = document.getElementById(it.id);
  el.innerHTML = itemShell(it, html);
  if (!r.done) el.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
    const o = opts[+b.dataset.k];
    record(it, o.ok, it.type === 'tf' ? it.tag : o.tag, {pick: o.t});
  }));
}

function renderFill(it){
  const r = S[it.id] || {};
  const {label, expr} = splitPrompt(it.p);
  const tplHasEq = it.tpl.includes('=');
  const parts = it.tpl.split('☐');
  const vals = r.vals || [];
  let row = '';
  parts.forEach((txt, i) => {
    row += `<span>${esc(txt)}</span>`;
    if (i < parts.length - 1){
      const isSign = it.ans[i] === '+' || it.ans[i] === '−';
      let st = '';
      if (r.done){ st = r.blankOk && r.blankOk[i] ? ' right' : ' wrong'; }
      if (isSign){
        const v = vals[i] || '';
        row += `<button class="sign${v ? '' : ' empty'}${st}" data-i="${i}" aria-label="Chọn dấu ô ${i + 1}" ${r.done ? 'disabled' : ''}>${v || '?'}</button>`;
      } else {
        row += `<input class="blank${st}" id="${it.id}-b${i}" data-i="${i}" inputmode="numeric" autocomplete="off" aria-label="Ô ${i + 1}" value="${esc(vals[i] || '')}" ${r.done ? 'disabled' : ''}>`;
      }
    }
  });
  let html = `<div class="ask">${esc(label && tplHasEq ? label : DEFAULT_ASK.fill)}</div>`;
  if (!tplHasEq) html += `<div class="math expr">${esc(expr)} =</div>`;
  html += `<div class="fillrow">${row}</div>`;
  if (!r.done) html += `<div class="actions"><button class="btn" data-check>Kiểm tra</button><span class="tip">Bấm vào ô <b>?</b> để đổi dấu + / −</span></div>`;
  else html += feedback(r.ok, r.ok ? '' : 'Đáp án đúng: ' + fillText(it, it.ans), it.sol, r.tag);
  const el = document.getElementById(it.id);
  el.innerHTML = itemShell(it, html);
  if (r.done) return;
  const cur = vals.slice();
  el.querySelectorAll('.sign').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.i; cur[i] = cur[i] === '+' ? '−' : '+'; b.textContent = cur[i]; b.classList.remove('empty');
  }));
  el.querySelectorAll('.blank').forEach(inp => inp.addEventListener('input', () => { cur[+inp.dataset.i] = inp.value; }));
  el.querySelector('[data-check]').addEventListener('click', () => {
    const n = it.ans.length;
    for (let i = 0; i < n; i++) if (!cur[i] || !String(cur[i]).trim()) { const t = el.querySelector('.tip'); t.textContent = 'Em điền hết các ô rồi bấm Kiểm tra nhé.'; t.style.color = 'var(--red)'; return; }
    const clean = cur.map(v => normSign(String(v)).trim());
    const lists = [it.ans].concat(it.alts);
    const match = lists.find(L => L.every((v, i) => normSign(v) === clean[i]));
    const ref = match || lists[0];
    const blankOk = ref.map((v, i) => normSign(v) === clean[i]);
    record(it, !!match, it.tag, {vals: cur.slice(0, n), blankOk});
  });
}
function fillText(it, ans){ const p = it.tpl.split('☐'); let s = ''; p.forEach((t, i) => { s += t; if (i < p.length - 1) s += ans[i]; }); return s; }

function renderSolve(it){
  const r = S[it.id] || {};
  const isNum = it.type === 'num';
  const {label, expr} = splitPrompt(it.p);
  const n = isNum ? 1 : it.roots.length;
  const vals = r.vals || [];
  let html = `<div class="ask">${esc(isNum ? (label || DEFAULT_ASK.num) : DEFAULT_ASK.solve)}${isNum ? '' : ` · phương trình có ${n} nghiệm`}</div><div class="math expr">${esc(isNum ? expr : it.p)}</div><div class="roots">`;
  for (let i = 0; i < n; i++){
    let st = r.done ? (r.okEach && r.okEach[i] ? ' right' : ' wrong') : '';
    html += `<label>${isNum ? '=' : 'x =' }<input class="blank${st}" id="${it.id}-r${i}" data-i="${i}" inputmode="text" autocomplete="off" value="${esc(vals[i] || '')}" ${r.done ? 'disabled' : ''} aria-label="${isNum ? 'Kết quả' : 'Nghiệm ' + (i + 1)}"></label>`;
  }
  html += '</div>';
  if (!r.done) html += `<div class="actions"><button class="btn" data-check>Kiểm tra</button><span class="tip">${isNum ? 'Nhập số, ví dụ 4900' : 'Phân số viết 5/2, số âm viết −3'}</span></div>`;
  else html += feedback(r.ok, r.ok ? '' : 'Đáp án đúng: ' + (isNum ? it.ans : it.roots.map(v => 'x = ' + v.replace('-', '−')).join('; ')), it.sol, r.tag);
  const el = document.getElementById(it.id);
  el.innerHTML = itemShell(it, html);
  if (r.done) return;
  el.querySelector('[data-check]').addEventListener('click', () => {
    const inputs = [...el.querySelectorAll('input')];
    const raw = inputs.map(i => i.value);
    const tip = el.querySelector('.tip');
    if (isNum){
      const v = parseInt(raw[0].replace(/[\s.,]/g, ''), 10);
      if (isNaN(v)){ tip.textContent = 'Em nhập một số nhé.'; tip.style.color = 'var(--red)'; return; }
      const ok = v === parseInt(it.ans, 10);
      record(it, ok, it.tag, {vals: raw, okEach: [ok]});
      return;
    }
    const nums = raw.map(parseNum);
    if (nums.some(isNaN)){ tip.textContent = 'Có ô chưa điền hoặc viết chưa đúng. Ví dụ: 3, −2, 5/2.'; tip.style.color = 'var(--red)'; return; }
    const want = it.roots.map(parseNum); const used = want.map(() => false);
    const okEach = nums.map(v => { const j = want.findIndex((w, k) => !used[k] && near(w, v)); if (j > -1){ used[j] = true; return true; } return false; });
    record(it, okEach.every(Boolean), it.tag, {vals: raw, okEach});
  });
}

function renderSpot(it){
  const r = S[it.id] || {};
  const {label, expr} = splitPrompt(it.p);
  const isEq = it.p.startsWith('Tìm x');
  let html = `<div class="ask">${esc(DEFAULT_ASK.spot)}</div><div class="math expr">${isEq ? esc(label + ': ' + expr) : esc(expr)}</div><div class="steps">`;
  it.steps.forEach((s, k) => {
    let cls = 'step' + (s[1] ? '' : ' txt');
    if (r.stepPick !== undefined){ if (k === r.stepPick) cls += k === it.wrong ? ' right' : ' wrong'; else if (k === it.wrong) cls += ' truth'; }
    html += `<button class="${cls}" data-k="${k}" ${r.stepPick !== undefined ? 'disabled' : ''}><span class="k">Bước ${k + 1}</span><span class="math">${esc(s[0])}</span></button>`;
  });
  html += '</div>';
  const fixes = shuffled(it.fixes.map(f => ({t: f[0], ok: f[1]})), it.id + 'f');
  if (r.stepPick !== undefined){
    const stepOk = r.stepPick === it.wrong;
    html += `<div class="fixq">${stepOk ? 'Đúng, bước ' + (it.wrong + 1) + ' sai.' : 'Bước sai đầu tiên là bước ' + (it.wrong + 1) + ' (viền đỏ nét đứt).'} Sửa lại bước ${it.wrong + 1} cho đúng:</div><div class="opts">`;
    fixes.forEach((f, k) => {
      let cls = 'opt' + (f.t.startsWith('=') ? '' : ' text');
      if (r.done){ if (f.ok) cls += ' right'; else if (r.fixPick === f.t) cls += ' wrong'; }
      html += `<button class="${cls}" data-f="${k}" ${r.done ? 'disabled' : ''}><span class="k">${LETTERS[k]}</span><span class="${f.t.startsWith('=') ? 'math' : ''}">${esc(f.t)}</span></button>`;
    });
    html += '</div>';
  }
  if (r.done) html += feedback(r.ok, r.ok ? '' : (r.stepPick !== it.wrong ? 'Em chọn chưa đúng bước sai.' : 'Em chọn chưa đúng cách sửa.'), it.sol, r.tag);
  const el = document.getElementById(it.id);
  el.innerHTML = itemShell(it, html);
  if (r.stepPick === undefined){
    el.querySelectorAll('.step').forEach(b => b.addEventListener('click', () => {
      S[it.id] = {stepPick: +b.dataset.k}; save(); renderItem(it);
    }));
  } else if (!r.done){
    el.querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => {
      const f = fixes[+b.dataset.f];
      const ok = r.stepPick === it.wrong && f.ok;
      record(it, ok, it.tag, {stepPick: r.stepPick, fixPick: f.t});
    }));
  }
}

function renderItem(it){
  ({mc: renderMC, tf: renderMC, fill: renderFill, solve: renderSolve, num: renderSolve, spot: renderSpot})[it.type](it);
}

// ---------- views
const LEVEL_DOTS = {'Nhận biết': '●○○', 'Thông hiểu': '●●○', 'Vận dụng': '●●●'};
let current = null;

function renderChrome(){
  const t = totalScore();
  document.getElementById('total').textContent = t.ok + '/' + t.total;
  const tabs = SECS.map(sec => { const s = secScore(sec); return `<a class="tab${current === sec.id ? ' on' : ''}${s.done === s.total ? ' full' : ''}" href="#${sec.id}">${esc(sec.short)}<span class="p">${s.ok}/${s.total}</span></a>`; }).join('')
    + `<a class="tab${current === 'ket-qua' ? ' on' : ''}" href="#ket-qua">Kết quả<span class="p">${t.done}/${t.total}</span></a>`;
  const nav = document.getElementById('tabs');
  const sl = nav.scrollLeft; nav.innerHTML = tabs; nav.scrollLeft = sl;
  const head = document.getElementById('secmeta');
  if (head && current !== 'ket-qua'){ const sec = SECS.find(s => s.id === current); const s = secScore(sec); head.textContent = `${s.total} câu · đã làm ${s.done} · đúng ${s.ok}`; }
}

function renderSection(sec){
  const idx = SECS.indexOf(sec);
  let html = `<div class="sec-head"><h2>${esc(sec.title)}</h2><div class="sec-meta" id="secmeta"></div></div><div class="rule"><b>Nhớ cách làm</b>${esc(sec.rule)}</div>`;
  sec.levels.forEach(lv => {
    html += `<section class="level"><div class="level-h">${esc(lv.name)}${LEVEL_DOTS[lv.name] ? ` <span class="dots" aria-hidden="true">${LEVEL_DOTS[lv.name]}</span>` : ''}</div>`;
    lv.items.forEach(it => { html += `<div class="item" id="${it.id}"></div>`; });
    html += '</section>';
  });
  const prev = idx > 0 ? SECS[idx - 1] : null, next = idx < SECS.length - 1 ? SECS[idx + 1] : null;
  html += `<div class="pager">${prev ? `<a href="#${prev.id}">← ${esc(prev.short)}</a>` : '<span></span>'}${next ? `<a href="#${next.id}">${esc(next.short)} →</a>` : `<a href="#ket-qua">Xem kết quả →</a>`}</div>`;
  html += `<div class="reset"><button class="btn ghost" id="resetSec">Làm lại ${esc(sec.short.toLowerCase())}</button></div>`;
  const main = document.getElementById('main');
  main.innerHTML = html;
  ITEMS.filter(i => i.sec === sec).forEach(renderItem);
  armReset(document.getElementById('resetSec'), () => { ITEMS.filter(i => i.sec === sec).forEach(i => delete S[i.id]); save(); renderSection(sec); renderChrome(); });
}

function armReset(btn, fn){
  let armed = false, label = btn.textContent;
  btn.addEventListener('click', () => {
    if (!armed){ armed = true; btn.textContent = 'Bấm lần nữa để xoá bài đã làm'; setTimeout(() => { armed = false; btn.textContent = label; }, 4000); return; }
    fn();
  });
}

function renderResults(){
  const t = totalScore();
  const pct = t.done ? Math.round(100 * t.ok / t.done) : 0;
  let msg;
  if (!t.done) msg = 'Em chưa làm câu nào. Chọn một dạng ở thanh phía trên để bắt đầu, nên làm Khởi động trước.';
  else if (t.done < t.total) msg = `Em đã làm ${t.done}/${t.total} câu, đúng ${t.ok} câu (${pct}% số câu đã làm). Làm tiếp các dạng còn lại nhé.`;
  else msg = `Em đã làm hết ${t.total} câu, đúng ${t.ok} câu (${pct}%).`;
  let rows = SECS.map(sec => { const s = secScore(sec); const w = s.total ? Math.round(100 * s.ok / s.total) : 0; return `<tr><td><a href="#${sec.id}">${esc(sec.short)}</a></td><td>${s.ok}/${s.total}</td><td>${s.done}/${s.total}</td><td><div class="bar" aria-hidden="true"><i style="width:${w}%"></i></div></td></tr>`; }).join('');
  // error tally
  const tally = {};
  ITEMS.forEach(it => { const r = S[it.id]; if (r && r.done && !r.ok && r.tag){ (tally[r.tag] = tally[r.tag] || []).push(it); } });
  const signList = Object.keys(tally).filter(k => SIGN.has(k)).sort((a, b) => tally[b].length - tally[a].length);
  const otherList = Object.keys(tally).filter(k => !SIGN.has(k)).sort((a, b) => tally[b].length - tally[a].length);
  const li = k => `<li><span class="c">${tally[k].length}</span><div><div class="l">${esc(TAGS[k])}</div><div class="w">Ở các câu: ${tally[k].map(it => `<a href="#${it.sec.id}" data-go="${it.id}">${esc(it.sec.short)} câu ${it.n}</a>`).join(', ')}</div></div></li>`;
  let html = `<div class="sec-head"><h2>Kết quả</h2></div><div class="res-top"><div class="big">${t.ok}/${t.total}</div><p>${msg}</p></div>
  <div class="tbl"><table><thead><tr><th>Dạng</th><th>Đúng</th><th>Đã làm</th><th>Tỉ lệ đúng</th></tr></thead><tbody>${rows}</tbody></table></div>
  <h3>Lỗi dấu em hay mắc nhất</h3>${signList.length ? `<ul class="errs">${signList.map(li).join('')}</ul>` : `<p class="empty">${t.done ? 'Chưa có lỗi dấu nào. Giỏi lắm!' : 'Làm bài xong, các lỗi dấu sẽ được thống kê ở đây.'}</p>`}
  ${otherList.length ? `<h3>Lỗi khác</h3><ul class="errs">${otherList.map(li).join('')}</ul>` : ''}
  <div class="reset"><button class="btn ghost" id="resetAll">Làm lại tất cả</button></div>`;
  document.getElementById('main').innerHTML = html;
  document.querySelectorAll('[data-go]').forEach(a => a.addEventListener('click', e => { pendingScroll = a.dataset.go; }));
  armReset(document.getElementById('resetAll'), () => { S = {}; save(); renderResults(); renderChrome(); });
}

let pendingScroll = null;
function route(){
  const h = (location.hash || '').slice(1);
  const sec = SECS.find(s => s.id === h);
  if (h === 'ket-qua'){ current = 'ket-qua'; renderResults(); }
  else { current = (sec || SECS[0]).id; renderSection(sec || SECS[0]); }
  renderChrome();
  const tab = document.querySelector('.tab.on'); if (tab) tab.scrollIntoView({block: 'nearest', inline: 'center'});
  if (pendingScroll){ const el = document.getElementById(pendingScroll); pendingScroll = null; if (el){ const y = el.getBoundingClientRect().top + window.scrollY - document.querySelector('.top').offsetHeight - 8; window.scrollTo(0, y); return; } }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
})();
</script>
